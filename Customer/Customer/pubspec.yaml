name: coop_gig_customer
description: Customer-facing app for a cooperative gig services marketplace.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  easy_localization: ^3.0.7+1
  flutter_dotenv: ^5.2.1
  intl: any
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  razorpay_flutter: ^1.4.6
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/translations/
    - assets/images/categories/
    - assets/images/services/
